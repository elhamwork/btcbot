# Run the watcher on GitHub's machines instead of your laptop.
#
# Free, no card, nothing to install. It starts every hour, watches, sends
# alerts to your phone, and commits what it learned back into cloud_state/ so
# the next run picks up where it left off.
#
# What it does NOT do: trade. There is no account, no key, no order. It reads
# public prices and sends notifications.
#
# HONEST LIMITS -- read these before relying on it:
#   * GitHub's scheduler is best-effort. Runs are often 10-40 minutes late and
#     under heavy load a scheduled run can be skipped entirely. Expect gaps.
#   * A job is capped at 6 hours, which is why this stops at 5h30 and restarts.
#   * Free minutes are unlimited only while this repo is PUBLIC. If you make it
#     private you get 2,000 minutes a month, which is about an hour a day.
#   * Your laptop, left awake, is more reliable than this. This is the
#     no-laptop option, not the better option.

name: watch

# Hourly, not every 6 hours. A 5h30 job followed by a 6-hourly cron leaves a
# gap whenever the cron and the job drift apart -- on 2026-08-24 a run that
# started off-schedule finished at 01:29 and nothing ran again until 06:07,
# so the bot was dark for four and a half hours and nobody could tell the
# difference between "no setups" and "not running".
#
# Each run now lasts 2 hours and a new one starts every hour and takes over,
# so the cover always overlaps. If GitHub skips or delays an hour -- it does
# both -- the running job carries on regardless. The handover is lossless
# because the outgoing run saves and the incoming one merges.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:            # and a "Run workflow" button

# A late-firing schedule used to queue behind the run it was meant to replace,
# so the next watcher sat idle for hours. It now takes over instead. The old
# run still saves on its way out (see always() below), and the new one merges
# with whatever it finds, so the handover loses nothing.
concurrency:
  group: watch
  cancel-in-progress: true

permissions:
  contents: write               # to commit what it learned

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The outgoing run saves as it is cancelled, but this one has already
      # checked the files out by then -- so it would start on an account up to
      # an hour stale, forget any wins in that window, and size its next bet
      # off the wrong number. Seen live on 2026-08-25: a balance of $1,031.34
      # came back as $1,014.46 after a handover, and the next alert reported
      # $911.52 instead of $928.40.
      #
      # Wait for the outgoing run to finish saving, then take its work.
      - name: Let the outgoing run save first
        run: |
          sleep 90
          git fetch origin "$GITHUB_REF_NAME" --quiet || true
          git checkout "origin/$GITHUB_REF_NAME" -- cloud_state || true
          python3 - <<'PY'
          import json
          try:
              m = json.load(open("cloud_state/check_memory.json"))
              b = m.get("bank", {})
              print("  starting from $%.2f, %d settled calls"
                    % (b.get("cash", 0), b.get("settled", 0)))
          except Exception as e:
              print("  no state to start from (%s)" % e)
          PY

      - name: Watch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CHECK_STATE_DIR: ${{ github.workspace }}/cloud_state
          CHECK_LABEL: cloud
        run: python3 check.py --loop --hours 2

      # always() so a timeout, a crash, or being cancelled by the next
      # scheduled run all still save the learning.
      - name: Save what it learned
        if: always()
        env:
          CHECK_STATE_DIR: ${{ github.workspace }}/cloud_state
        run: |
          set -u
          git config user.name  "btcbot"
          git config user.email "btcbot@users.noreply.github.com"
          cp cloud_state/check_memory.json /tmp/mine.json 2>/dev/null || echo '{}' > /tmp/mine.json
          for i in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME" || { sleep $((2 ** i)); continue; }
            # Start from whatever is on the branch NOW, then fold our own
            # copy into it. Two watchers can hold the memory at once -- a
            # handover, a re-run, the laptop -- and a plain overwrite would
            # silently drop one side's settled calls.
            git reset --hard "origin/$GITHUB_REF_NAME"
            git show "origin/$GITHUB_REF_NAME:cloud_state/check_memory.json" \
              > /tmp/theirs.json 2>/dev/null || echo '{}' > /tmp/theirs.json
            python3 merge_state.py /tmp/mine.json /tmp/theirs.json \
              cloud_state/check_memory.json
            python3 check.py --report || true
            git add cloud_state
            if git diff --staged --quiet; then echo "nothing new"; exit 0; fi
            git commit -m "watch: $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((2 ** i))
          done
          exit 1
